# prometheus.yml

global:
  # Cada cuánto Prometheus scrapea TODOS los targets, salvo que
  # un job específico lo sobreescriba.
  scrape_interval: 15s
  # Cada cuánto evalúa reglas de alerta (no las usaremos aún, pero
  # es buena práctica dejarlo configurado desde ya)
  evaluation_interval: 15s

scrape_configs:
  # Prometheus se monitorea a sí mismo. Útil para ver si el propio
  # Prometheus está saludable (uso de memoria, tiempo de scrape, etc.)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'  # el endpoint que expusimos arriba
    scrape_interval: 10s                   # override del global, si quieres más granularidad aquí
    static_configs:
      # OJO: "gateway" aquí es el nombre del SERVICIO en docker-compose,
      # no "localhost". Docker Compose crea una red interna donde los
      # contenedores se resuelven por nombre (DNS interno de Docker).
      - targets: ['gateway:7080']
        labels:
          service: gateway

