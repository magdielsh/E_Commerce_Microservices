server:
  port: 7080

spring:
  application:
    name: gateway

  # ─────────────────────────────────────────────────────────────────────
  # CLOUD GATEWAY ROUTES
  # Cada "route" define: qué peticiones capturar (predicates)
  # y a dónde reenviarlas (uri).
  # ─────────────────────────────────────────────────────────────────────
  cloud:
    gateway:
      httpclient:
        connect-timeout: 1000 # Tiempo máximo para establecer la conexión TCP (2 segundos)
        response-timeout: 3000  # Tiempo máximo total de respuesta HTTP global (5 segundos)
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: lb://account-service
          predicates:
            - Path=/v1/api/auth/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                methods: GET
                backoff:
                  firstBackoff: 100ms       # Tiempo de espera inicial para el primer reintento
                  maxBackoff: 2000ms        # Tiempo de espera máximo permitido (tope de la curva)
                  factor: 2                 # Multiplicador exponencial (100ms * 2 = 200ms -> 400ms -> etc.)
                  basedOnPreviousValue: true # Aplica el multiplicador sobre el retraso inmediatamente anterior
            - name: CircuitBreaker
              args:
                name: accountServiceCircuitBreaker
                fallbackUri: forward:/fallback/account-service

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/v1/api/users/**
          filters:
            - name: Retry
              args:
                retries: 3                  # Número máximo de intentos (el original + 2 reintentos)
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE # En qué códigos HTTP reintentar
                methods: GET                # Se recomienda reintentar solo métodos idempotentes (GET)
                backoff:
                  firstBackoff: 50ms        # Tiempo de espera antes del primer reintento
                  maxBackoff: 500ms
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service # Ruta interna si falla

        # Ruta especial SOLO para exponer la spec OpenAPI de orders-service bajo un path con prefijo,
        # asi el gateway puede distinguir de que servicio es cada documentacion agregada.
        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            # Spring Cloud Gateway envia la peticion a /orders-service/v3/api-docs,
            # pero orders-service en realidad expone la suya en /v3/api-docs (sin prefijo).
            # RewritePath reescribe la URL antes de reenviarla.
            - RewritePath=/user-service/v3/api-docs, /v3/api-docs

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/v1/api/orders/**

        - id: order-service-actuator
          uri: lb://order-service
          predicates:
            - Path=/actuator/**

        - id: products-service
          uri: lb://products-service
          predicates:
            - Path=/v1/api/products/**

# Configuración específica de Resilience4j
resilience4j:
  timelimiter:
    instances:
      accountServiceCircuitBreaker:
        timeoutDuration: 3s
      userServiceCircuitBreaker:
        timeoutDuration: 3s # Si el Tomcat del microservicio tarda más de 2 segundos, se corta.
  circuitbreaker:
    instances:
      accountServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10 # Evalúa las últimas 10 peticiones
        failureRateThreshold: 50 # Si el 50% falla o da timeout, abre el circuito
        waitDurationInOpenState: 10s # Tiempo que se queda abierto antes de reintentar
      userServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10 # Evalúa las últimas 10 peticiones
        failureRateThreshold: 50 # Si el 50% falla o da timeout, abre el circuito
        waitDurationInOpenState: 10s # Tiempo que se queda abierto antes de reintentar
  bulkhead:
    instances:
      accountServiceCircuitBreaker:
        maxConcurrentCalls: 20
        maxWaitDuration: 100ms
      userServiceCircuitBreaker:
        maxConcurrentCalls: 20 # Máximo 20 peticiones concurrentes permitidas hacia este microservicio
        maxWaitDuration: 100ms # Si llega la petición 21, espera máximo 100ms en cola antes de ser rechazada

# -----------------------------------------------------------------------------
# EUREKA SERVICE DISCOVERY
# -----------------------------------------------------------------------------
eureka:
  # Client configuration
  client:
    # Habilitar registro en Eureka
    enabled: true
    # URL del Eureka Server
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    # Registry fetch interval (seconds)
    registry-fetch-interval-seconds: 30
    # Instance preference
    instance-info-replication-interval-seconds: 30
  # Instance configuration
  instance:
    # Prefer IP address (vs hostname)
    prefer-ip-address: true
    # Instance ID en Eureka
    instance-id: ${spring.application.name}:${server.port}
    # Lease renewal interval (seconds)
    lease-renewal-interval-in-seconds: 30
    # Lease expiration duration (seconds)
    lease-expiration-duration-in-seconds: 90


# ─────────────────────────────────────────────────────────────────────
# JWT: la misma clave secreta que usó Auth Service para firmar.
# Gracias a esto el gateway puede verificar la firma sin llamar
# a Auth Service en cada petición (verificación local = muy rápido).
# ─────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}

gateway:
  secret: ${GATEWAY_SECRET}

# ─────────────────────────────────────────────────────────────────────
# Rutas públicas: no requieren JWT.
# El filtro leerá esta lista para saber qué dejar pasar sin validar.
# ─────────────────────────────────────────────────────────────────────
public:
  routes:
    - /swagger-ui/**
    - /actuator/circuitbreakers
    - /actuator/info
    - /actuator/metrics
    - /actuator/retries
    - /swagger-ui.html
    - /v3/api-docs/**
    - /user-service/v3/api-docs
    - /v1/api/auth/login
    - /v1/api/users/register
    - /v1/api/users/verify

# Aqui esta la parte clave de la agregacion: le decimos a springdoc-ui del propio gateway
# que en vez de generar su propia spec, muestre un selector con las specs de otros servicios.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
    # Cuando agregas mas microservicios, solo añades una entrada mas aqui y una ruta mas arriba:
    # - name: inventory-service
    #   url: /inventory-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics # Expone el formato nativo para Prometheus
  endpoint:
    health:
      show-details: always # Opcional: muestra detalles de salud en /actuator/health
  metrics:
    tags:
      application: ${spring.application.name} # Añade una etiqueta con el nombre del Gateway a todas las métricas
    distribution:
      percentiles-histogram:
        # Habilita histogramas para el timer de requests HTTP.
        # Esto es lo que te permite calcular percentiles (p50, p95, p99)
        # de latencia en Grafana usando histogram_quantile() en PromQL.
        # Sin esto, solo tendrías promedios, que ocultan outliers.
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s
  prometheus:
    metrics:
      export:
        # Habilita explícitamente la exportación al formato Prometheus.
        # (En versiones recientes de Spring Boot ya viene true por defecto
        # con la dependencia en el classpath, pero es buena práctica
        # dejarlo explícito para que quede documentado en el config)
        enabled: true


logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    # Activa los logs internos para ver el ciclo de vida del filtro de reintentos
    org.springframework.cloud.gateway.filter.factory.RetryGatewayFilterFactory: TRACE
    # Opcional: ver cómo Netty (el cliente interno) reintenta la conexión TCP
    org.springframework.cloud.gateway.filter.NettyRoutingFilter: DEBUG